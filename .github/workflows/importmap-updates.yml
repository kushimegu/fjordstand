name: Importmap updates

on:
  schedule:
    - cron: '0 9 * * 1'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:

concurrency: importmap-updates

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvips

      - name: Check for Importmap updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: ruby .github/scripts/check_importmap_updates.rb
